# Independent static release; no Moriium Admin upstream is used here.
server {
    listen 80;
    listen [::]:80;
    server_name enouia.morii9961.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / {
        return 301 https://enouia.morii9961.top$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name enouia.morii9961.top;

    ssl_certificate /etc/letsencrypt/live/enouia.morii9961.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enouia.morii9961.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/enouia/current;
    index index.html;
    access_log /var/log/nginx/enouia.morii9961.top.access.log combined;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }
    location = /index.html {
        expires -1;
    }
    location /_astro/ {
        expires 1y;
    }
    location /images/ {
        expires 1h;
    }
    location ~ /\. {
        deny all;
    }
}
