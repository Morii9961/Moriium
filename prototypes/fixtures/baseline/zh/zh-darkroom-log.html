<p>这卷胶片拍完放了半年，我决定分三段冲，好把变量隔开。</p>
<p>第一次药液温度 22 度，显影六分钟。出来整卷偏薄，暗部几乎没有细节。第二次把时间加到八分钟，密度是够了，但颗粒粗得不能看——温度还是 22 度，而这支显影液的标称温度是 20 度。</p>
<p>第三次我先把药液坐进冷水里降到 20 度，显影七分钟，中间每三十秒轻翻一次。这次对了。</p>
<p>结论没什么新意：温度比时间重要。我之前一直用延长时间去补偿偏高的温度，那只会同时放大颗粒。真正该做的是把温度压回标称值，再按标称时间走。</p>
<p>下次要试的是把水洗从五分钟延长到十分钟，看定影残留是否是我一直没注意到的另一个变量。</p>
