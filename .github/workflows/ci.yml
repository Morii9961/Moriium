name: Verify, build, and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moriium-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute GitHub card cache date
        id: github-cache-date
        shell: bash
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore GitHub repository card metadata
        id: github-card-cache
        uses: actions/cache@v6
        with:
          path: .cache/github.json
          key: github-cards-v1-${{ steps.github-cache-date.outputs.date }}-${{ hashFiles('src/content/posts/**/*.md') }}
          restore-keys: |
            github-cards-v1-

      - name: Verify and build
        run: pnpm verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_CACHE_FRESH: ${{ steps.github-card-cache.outputs.cache-hit }}

      - name: Confirm static output contains no protected source directory
        shell: bash
        run: |
          test ! -e dist/client/.private
          ! grep -R --line-number --fixed-string '.private/posts' dist/client

      # CI proves the repository build. Production content lives only in the
      # VPS database, so the deploy artifact is source and the same verified
      # release state machine performs the authoritative build beside that data.
      - name: Package verified source
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        run: git archive --format=tar.gz --output="moriium-${GITHUB_SHA}.tar.gz" "$GITHUB_SHA"

      - name: Configure deployment key
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload source archive and deployment driver
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp "moriium-${GITHUB_SHA}.tar.gz" "${VPS_USER}@${VPS_HOST}:/tmp/moriium-${GITHUB_SHA}.tar.gz"
          scp deploy/bin/deploy-code.sh "${VPS_USER}@${VPS_HOST}:/tmp/moriium-deploy-${GITHUB_SHA}.sh"

      - name: Build beside production data and release
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_RELEASE_ROOT: ${{ secrets.VPS_RELEASE_ROOT }}
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" \
            "bash /tmp/moriium-deploy-${GITHUB_SHA}.sh '$GITHUB_SHA' '$VPS_RELEASE_ROOT' 'https://morii9961.top/zh/' 'https://morii9961.top/admin/'"
