[Definition]
# Nginx combined log: ban only failed POSTs to the one login endpoint.
# Anchoring the request and status prevents author-controlled paths or agents
# from being interpreted as an authentication failure.
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "POST /api/login/?(?:\?[^\"]*)? HTTP/\d(?:\.\d)?" (?:401|429) \d+
ignoreregex =
