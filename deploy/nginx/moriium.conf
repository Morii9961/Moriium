map $uri $moriium_legacy_redirect {
  default "";
  include /etc/nginx/snippets/moriium-legacy-redirects.map;
}

server {
  listen 80;
  listen [::]:80;
  server_name morii9961.top www.morii9961.top;
  return 301 https://morii9961.top$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name morii9961.top;

  root /var/www/moriium/current;
  index index.html;

  # TLS certificate directives are managed by the VPS certificate workflow.
  # ssl_certificate ...;
  # ssl_certificate_key ...;

  if ($moriium_legacy_redirect != "") {
    return 301 $moriium_legacy_redirect;
  }

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self' https://meting.spr-aachen.com; frame-src 'self' https://www.youtube-nocookie.com https://player.bilibili.com; upgrade-insecure-requests" always;

  location = / {
    return 302 /zh/;
  }

  location ~* \.(?:css|js|mjs|avif|webp|png|jpe?g|gif|svg|ico|woff2?|mp3|m4a|aac|ogg|mp4|webm)$ {
    expires 1y;
    try_files $uri =404;
  }

  location ~* \.(?:html|xml)$ {
    expires -1;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.morii9961.top;
  return 301 https://morii9961.top$request_uri;
}
