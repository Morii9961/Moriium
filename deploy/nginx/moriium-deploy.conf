# Optional snippet, installed only during explicit automatic-deployment activation.
# Include inside the existing morii9961.top HTTPS server block.
location = /api/deploy-hook/ {
  client_max_body_size 1m;
  proxy_pass http://127.0.0.1:4322;
  proxy_connect_timeout 2s;
  proxy_read_timeout 10s;
  proxy_set_header Host $host;
}

location ^~ /_astro/ {
  alias /var/www/moriium/assets/_astro/;
  expires 1y;
}

location ^~ /media/ {
  alias /var/www/moriium/assets/media/;
  expires 1y;
}

location = /release-version.json {
  expires -1;
  try_files $uri =404;
}
